apiVersion: v1
kind: Service
metadata:
  name: healthcare-preview-service
  namespace: healthcare
  labels:
    app: healthcare-app
    env: preview
spec:
  type: NodePort
  selector:
    app: healthcare-app
    version: green # Points to idle/candidate environment for automated testing
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30081
