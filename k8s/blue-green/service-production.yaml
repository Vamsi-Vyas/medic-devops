apiVersion: v1
kind: Service
metadata:
  name: healthcare-service
  namespace: healthcare
  labels:
    app: healthcare-app
    env: production
spec:
  type: NodePort
  selector:
    app: healthcare-app
    version: blue # Points to active environment (swapped by Jenkins/script)
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
