# Role-Based Access Control (RBAC) - Principle of Least Privilege for Healthcare Workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-service-account
  namespace: healthcare
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healthcare-pod-reader
  namespace: healthcare
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcare-role-binding
  namespace: healthcare
subjects:
  - kind: ServiceAccount
    name: healthcare-service-account
    namespace: healthcare
roleRef:
  kind: Role
  name: healthcare-pod-reader
  apiGroup: rbac.authorization.k8s.io
